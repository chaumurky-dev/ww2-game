[package]
name = "wartide-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wartide web client (Leptos CSR)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
futures = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "DomRect", "HtmlElement", "SvgElement",
  "PointerEvent", "WheelEvent", "MouseEvent", "Event", "EventTarget", "Storage", "Location", "RequestCredentials",
] }
js-sys = "0.3"
wartide-protocol = { path = "../protocol" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
