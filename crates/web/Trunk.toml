[build]
target = "index.html"
dist = "dist"

# Pin the wasm-opt (Binaryen) release trunk downloads. Do NOT use distro binaryen packages:
# Debian bookworm ships Binaryen 105, which mangles the externref table wasm-bindgen >= 0.2.100
# emits, and the app dies at startup with "WebAssembly.Table.grow(): failed to grow table".
[tools]
wasm_opt = "version_123"

[serve]
address = "127.0.0.1"
port = 8081

[[proxy]]
backend = "http://localhost:8080/api"

[[proxy]]
backend = "ws://localhost:8080/ws"
ws = true
