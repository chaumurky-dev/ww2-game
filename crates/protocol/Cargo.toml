[package]
name = "wartide-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wartide-engine = { path = "../engine" }
serde = { workspace = true }
serde_json = { workspace = true }
# wasm-friendly: no RNG/clock features here (the server enables v4 / clock itself).
uuid = { version = "1", default-features = false, features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# Server-only: derive sqlx::Type for the TEXT-backed enums. The web must not enable this.
sqlx = { version = "0.8", default-features = false, optional = true }

[features]
sqlx = ["dep:sqlx"]
