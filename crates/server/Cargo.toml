[package]
name = "wartide-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wartide_server"
path = "src/lib.rs"

[[bin]]
name = "wartide-server"
path = "src/main.rs"

[dependencies]
wartide-protocol = { path = "../protocol", features = ["sqlx"] }
wartide-engine = { path = "../engine" }
wartide-ai = { path = "../ai" }
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "compression-full", "fs", "request-id", "util", "timeout"] }
tower_governor = "0.8"
argon2 = "0.5"
rand = { workspace = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls", "tokio1", "builder", "hostname", "pool", "rustls-platform-verifier", "ring"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"
dotenvy = "0.15"
skillratings = "0.29"
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.23"
futures-util = "0.3"
http = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
