name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.14"
  DATABASE_URL: postgres://wartide:wartide@localhost:5432/wartide

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude wartide-web --all-targets -- -D warnings
      - run: cargo clippy -p wartide-web --target wasm32-unknown-unknown -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wartide
          POSTGRES_PASSWORD: wartide
          POSTGRES_DB: wartide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wartide -d wartide"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk (pinned release binary)
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trunk
          trunk --version
      # wasm-opt is downloaded by trunk at the version pinned in crates/web/Trunk.toml
      - run: cd crates/web && trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/web/dist
          retention-days: 7

  docker-build:
    # Catches Dockerfile drift on PRs; builds only, never pushes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wartide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
